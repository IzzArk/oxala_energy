name: Hostinger Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel to Hostinger
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. Install SSH key
      # ==================================================
      - name: Install SSH key
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ==================================================
      # 3. Test SSH
      # ==================================================
      - name: Test SSH connection
        shell: bash
        run: |
          set -e

          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      # ==================================================
      # 4. Deploy
      # ==================================================
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "=========================================="
            echo "🚀 Starting Laravel deployment"
            echo "=========================================="

            # ==================================================
            # VARIABLES
            # ==================================================

            APP_DIR="$HOME/domains/${{ secrets.WEBSITE_FOLDER }}"

            echo ""
            echo "📁 Application directory:"
            echo "$APP_DIR"

            # ==================================================
            # CHECK APPLICATION DIRECTORY
            # ==================================================

            if [ ! -d "$APP_DIR" ]; then
                echo "❌ Application directory does not exist:"
                echo "$APP_DIR"
                exit 1
            fi

            cd "$APP_DIR"

            echo ""
            echo "📍 Current directory:"
            pwd

            # ==================================================
            # CHECK GIT REPOSITORY
            # ==================================================

            if [ ! -d ".git" ]; then
                echo "❌ Git repository not found!"
                exit 1
            fi

            echo ""
            echo "🔎 Git repository:"
            git rev-parse --show-toplevel

            # ==================================================
            # CHECK IMPORTANT FILES
            # ==================================================

            if [ ! -f "artisan" ]; then
                echo "❌ Laravel artisan file not found!"
                exit 1
            fi

            if [ ! -f "composer.json" ]; then
                echo "❌ composer.json not found!"
                exit 1
            fi

            # ==================================================
            # PROTECT IMPORTANT DIRECTORIES
            # ==================================================

            echo ""
            echo "🔒 Checking important directories..."

            if [ ! -d "storage" ]; then
                echo "❌ storage directory does not exist!"
                exit 1
            fi

            if [ ! -f ".env" ]; then
                echo "❌ .env does not exist!"
                echo "Deployment stopped to protect production configuration."
                exit 1
            fi

            # ==================================================
            # BACKUP CURRENT COMMIT
            # ==================================================

            CURRENT_COMMIT=$(git rev-parse HEAD)

            echo ""
            echo "📌 Current production commit:"
            echo "$CURRENT_COMMIT"

            # ==================================================
            # FETCH LATEST CODE
            # ==================================================

            echo ""
            echo "📥 Fetching latest code..."

            git fetch origin main

            TARGET_COMMIT=$(git rev-parse origin/main)

            echo ""
            echo "📌 Target commit:"
            echo "$TARGET_COMMIT"

            # ==================================================
            # UPDATE SOURCE CODE
            # ==================================================

            echo ""
            echo "🔄 Updating source code..."

            git checkout main

            git reset --hard origin/main

            # ==================================================
            # VERIFY IMPORTANT FILES AFTER UPDATE
            # ==================================================

            echo ""
            echo "🔎 Verifying deployment..."

            if [ ! -f ".env" ]; then
                echo "❌ .env disappeared after Git update!"
                echo "Restoring previous commit..."

                git reset --hard "$CURRENT_COMMIT"

                exit 1
            fi

            if [ ! -d "storage" ]; then
                echo "❌ storage disappeared after Git update!"
                echo "Restoring previous commit..."

                git reset --hard "$CURRENT_COMMIT"

                exit 1
            fi

            if [ ! -d "public" ]; then
                echo "❌ public directory missing!"
                exit 1
            fi

            if [ ! -f "public/index.php" ]; then
                echo "❌ public/index.php missing!"
                exit 1
            fi

            # ==================================================
            # COMPOSER
            # ==================================================

            echo ""
            echo "📦 Installing Composer dependencies..."

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

            # ==================================================
            # STORAGE LINK
            # ==================================================

            echo ""
            echo "🔗 Checking storage link..."

            if [ ! -L "public/storage" ]; then
                php artisan storage:link
            else
                echo "✅ Storage link already exists"
            fi

            # ==================================================
            # DATABASE BACKUP
            # ==================================================

            echo ""
            echo "💾 Creating database backup..."

            BACKUP_DIR="$HOME/database-backups"

            mkdir -p "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/database-$(date +%Y%m%d-%H%M%S).sql"

            if command -v mysqldump >/dev/null 2>&1; then

                DB_CONNECTION=$(grep '^DB_CONNECTION=' .env | cut -d '=' -f2-)

                if [ "$DB_CONNECTION" = "mysql" ]; then

                    DB_HOST=$(grep '^DB_HOST=' .env | cut -d '=' -f2-)
                    DB_PORT=$(grep '^DB_PORT=' .env | cut -d '=' -f2-)
                    DB_DATABASE=$(grep '^DB_DATABASE=' .env | cut -d '=' -f2-)
                    DB_USERNAME=$(grep '^DB_USERNAME=' .env | cut -d '=' -f2-)
                    DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2-)

                    if [ -n "$DB_HOST" ] && \
                       [ -n "$DB_DATABASE" ] && \
                       [ -n "$DB_USERNAME" ]; then

                        MYSQL_PWD="$DB_PASSWORD" mysqldump \
                          -h "$DB_HOST" \
                          -P "${DB_PORT:-3306}" \
                          -u "$DB_USERNAME" \
                          "$DB_DATABASE" \
                          > "$BACKUP_FILE"

                        echo "✅ Database backup created:"
                        echo "$BACKUP_FILE"

                    else
                        echo "⚠️ Database credentials incomplete."
                        echo "⚠️ Skipping database backup."
                    fi

                else
                    echo "ℹ️ Database is not MySQL."
                    echo "ℹ️ Skipping mysqldump."
                fi

            else
                echo "⚠️ mysqldump not available."
                echo "⚠️ Skipping database backup."
            fi

            # ==================================================
            # RUN MIGRATIONS
            # ==================================================

            echo ""
            echo "🗄️ Running Laravel migrations..."

            php artisan migrate --force

            # ==================================================
            # CLEAR CACHE
            # ==================================================

            echo ""
            echo "🧹 Clearing Laravel cache..."

            php artisan optimize:clear

            # ==================================================
            # CACHE CONFIGURATION
            # ==================================================

            echo ""
            echo "⚡ Caching configuration..."

            php artisan config:cache

            # ==================================================
            # CACHE ROUTES
            # ==================================================

            echo ""
            echo "⚡ Caching routes..."

            php artisan route:cache

            # ==================================================
            # CACHE VIEWS
            # ==================================================

            echo ""
            echo "⚡ Caching views..."

            php artisan view:cache

            # ==================================================
            # QUEUE
            # ==================================================

            echo ""
            echo "🔄 Restarting queue workers..."

            php artisan queue:restart || true

            # ==================================================
            # FINAL CHECK
            # ==================================================

            echo ""
            echo "🔎 Final deployment check..."

            if [ ! -f ".env" ]; then
                echo "❌ .env missing!"
                exit 1
            fi

            if [ ! -d "storage" ]; then
                echo "❌ storage missing!"
                exit 1
            fi

            if [ ! -f "public/index.php" ]; then
                echo "❌ public/index.php missing!"
                exit 1
            fi

            # ==================================================
            # DEPLOYMENT SUCCESS
            # ==================================================

            echo ""
            echo "=========================================="
            echo "✅ Deployment completed successfully!"
            echo "=========================================="

            echo ""
            echo "📊 Deployment information:"
            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Date: $(date)"
            echo "Directory: $(pwd)"

            echo ""
            echo "📁 Important directories:"
            echo "Storage: $(du -sh storage 2>/dev/null | cut -f1)"
            echo "Public:  $(du -sh public 2>/dev/null | cut -f1)"
            echo "Vendor:  $(du -sh vendor 2>/dev/null | cut -f1)"

            echo ""
            echo "🎉 Done!"