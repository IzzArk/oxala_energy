name: Hostinger Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel to Hostinger
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup PHP
      # ==================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_mysql
          tools: composer
          coverage: none

      # ==================================================
      # 3. Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # ==================================================
      # 4. Install NPM dependencies
      # ==================================================
      - name: Install NPM dependencies
        run: npm ci

      # ==================================================
      # 5. Build frontend
      # ==================================================
      - name: Build frontend
        run: npm run build

      # ==================================================
      # 6. Verify build
      # ==================================================
      - name: Verify frontend build
        shell: bash
        run: |
          set -e

          if [ ! -d "public/build" ]; then
            echo "❌ public/build tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "public/build/manifest.json" ]; then
            echo "❌ public/build/manifest.json tidak ditemukan!"
            exit 1
          fi

          echo "✅ Frontend build berhasil"
          echo ""
          echo "📁 Build contents:"
          du -sh public/build
          find public/build -maxdepth 2 -type f | head -30

      # ==================================================
      # 7. Install SSH key
      # ==================================================
      - name: Install SSH key
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      # ==================================================
      # 8. Test SSH connection
      # ==================================================
      - name: Test SSH connection
        shell: bash
        run: |
          set -e

          ssh \
            -p "${{ secrets.SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      # ==================================================
      # 9. Deploy source code
      # ==================================================
      - name: Deploy source code to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "=========================================="
            echo "🚀 Starting Laravel deployment"
            echo "=========================================="

            # ==================================================
            # VARIABLES
            # ==================================================

            APP_DIR="$HOME/domains/oxalaenergy.com"

            echo ""
            echo "📁 Application directory:"
            echo "$APP_DIR"

            # ==================================================
            # CHECK APPLICATION DIRECTORY
            # ==================================================

            if [ ! -d "$APP_DIR" ]; then
                echo "❌ Application directory does not exist:"
                echo "$APP_DIR"
                exit 1
            fi

            cd "$APP_DIR"

            echo ""
            echo "📍 Current directory:"
            pwd

            # ==================================================
            # CHECK GIT REPOSITORY
            # ==================================================

            if [ ! -d ".git" ]; then
                echo "❌ Git repository not found!"
                exit 1
            fi

            echo ""
            echo "🔎 Git repository:"
            git rev-parse --show-toplevel

            # ==================================================
            # CHECK IMPORTANT FILES
            # ==================================================

            if [ ! -f "artisan" ]; then
                echo "❌ Laravel artisan file not found!"
                exit 1
            fi

            if [ ! -f "composer.json" ]; then
                echo "❌ composer.json not found!"
                exit 1
            fi

            # ==================================================
            # PROTECT PRODUCTION FILES
            # ==================================================

            echo ""
            echo "🔒 Checking production files..."

            if [ ! -f ".env" ]; then
                echo "❌ .env does not exist!"
                echo "Deployment stopped to protect production configuration."
                exit 1
            fi

            if [ ! -d "storage" ]; then
                echo "❌ storage directory does not exist!"
                exit 1
            fi

            # ==================================================
            # SAVE CURRENT COMMIT
            # ==================================================

            CURRENT_COMMIT=$(git rev-parse HEAD)

            echo ""
            echo "📌 Current production commit:"
            echo "$CURRENT_COMMIT"

            # ==================================================
            # FETCH LATEST CODE
            # ==================================================

            echo ""
            echo "📥 Fetching latest code..."

            git fetch origin main

            TARGET_COMMIT=$(git rev-parse origin/main)

            echo ""
            echo "📌 Target commit:"
            echo "$TARGET_COMMIT"

            # ==================================================
            # UPDATE SOURCE CODE
            # ==================================================

            echo ""
            echo "🔄 Updating source code..."

            git checkout main
            git reset --hard origin/main

            # ==================================================
            # VERIFY SOURCE CODE
            # ==================================================

            echo ""
            echo "🔎 Verifying deployment..."

            if [ ! -f ".env" ]; then
                echo "❌ .env disappeared after Git update!"
                echo "Restoring previous commit..."

                git reset --hard "$CURRENT_COMMIT"

                exit 1
            fi

            if [ ! -d "storage" ]; then
                echo "❌ storage disappeared after Git update!"
                echo "Restoring previous commit..."

                git reset --hard "$CURRENT_COMMIT"

                exit 1
            fi

            if [ ! -d "public" ]; then
                echo "❌ public directory missing!"
                exit 1
            fi

            if [ ! -f "public/index.php" ]; then
                echo "❌ public/index.php missing!"
                exit 1
            fi

            # ==================================================
            # COMPOSER
            # ==================================================

            echo ""
            echo "📦 Installing Composer dependencies..."

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

            # ==================================================
            # STORAGE LINK
            # ==================================================

            echo ""
            echo "🔗 Checking storage link..."

            if [ -L "public/storage" ]; then

                echo "✅ Storage symlink already exists"

            elif [ -e "public/storage" ]; then

                echo "❌ public/storage exists but is NOT a symlink!"
                echo "Deployment stopped to protect uploaded files."

                exit 1

            else

                php artisan storage:link

            fi

            # ==================================================
            # DATABASE BACKUP
            # ==================================================

            echo ""
            echo "💾 Creating database backup..."

            BACKUP_DIR="$HOME/database-backups"

            mkdir -p "$BACKUP_DIR"

            BACKUP_FILE="$BACKUP_DIR/database-$(date +%Y%m%d-%H%M%S).sql"

            if command -v mysqldump >/dev/null 2>&1; then

                DB_CONNECTION=$(grep '^DB_CONNECTION=' .env | cut -d '=' -f2-)

                if [ "$DB_CONNECTION" = "mysql" ]; then

                    DB_HOST=$(grep '^DB_HOST=' .env | cut -d '=' -f2-)
                    DB_PORT=$(grep '^DB_PORT=' .env | cut -d '=' -f2-)
                    DB_DATABASE=$(grep '^DB_DATABASE=' .env | cut -d '=' -f2-)
                    DB_USERNAME=$(grep '^DB_USERNAME=' .env | cut -d '=' -f2-)
                    DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | cut -d '=' -f2-)

                    if [ -n "$DB_HOST" ] && \
                       [ -n "$DB_DATABASE" ] && \
                       [ -n "$DB_USERNAME" ]; then

                        MYSQL_PWD="$DB_PASSWORD" mysqldump \
                          -h "$DB_HOST" \
                          -P "${DB_PORT:-3306}" \
                          -u "$DB_USERNAME" \
                          "$DB_DATABASE" \
                          > "$BACKUP_FILE"

                        echo "✅ Database backup created:"
                        echo "$BACKUP_FILE"

                    else

                        echo "⚠️ Database credentials incomplete."
                        echo "⚠️ Skipping database backup."

                    fi

                else

                    echo "ℹ️ Database is not MySQL."
                    echo "ℹ️ Skipping mysqldump."

                fi

            else

                echo "⚠️ mysqldump not available."
                echo "⚠️ Skipping database backup."

            fi

            # ==================================================
            # RUN MIGRATIONS
            # ==================================================

            echo ""
            echo "🗄️ Running Laravel migrations..."

            php artisan migrate --force

            # ==================================================
            # CLEAR CACHE
            # ==================================================

            echo ""
            echo "🧹 Clearing Laravel cache..."

            php artisan optimize:clear

            # ==================================================
            # CACHE CONFIGURATION
            # ==================================================

            echo ""
            echo "⚡ Caching configuration..."

            php artisan config:cache

            # ==================================================
            # CACHE ROUTES
            # ==================================================

            echo ""
            echo "⚡ Caching routes..."

            php artisan route:cache

            # ==================================================
            # CACHE VIEWS
            # ==================================================

            echo ""
            echo "⚡ Caching views..."

            php artisan view:cache

            # ==================================================
            # QUEUE
            # ==================================================

            echo ""
            echo "🔄 Restarting queue workers..."

            php artisan queue:restart || true

            echo ""
            echo "✅ Source deployment completed"

      # ==================================================
      # 10. Upload Vite build
      # ==================================================
      - name: Upload frontend build
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "📦 Uploading frontend build"
          echo "=========================================="

          rsync \
            -az \
            --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_rsa" \
            public/build/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/u388571771/domains/oxalaenergy.com/public/build/"

          echo ""
          echo "✅ Frontend build uploaded successfully"

      # ==================================================
      # 11. Final verification
      # ==================================================
      - name: Final deployment verification
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            APP_DIR="$HOME/domains/oxalaenergy.com"

            cd "$APP_DIR"

            echo "=========================================="
            echo "🔎 Final deployment check"
            echo "=========================================="

            # Laravel
            if [ ! -f "artisan" ]; then
                echo "❌ artisan missing!"
                exit 1
            fi

            # Environment
            if [ ! -f ".env" ]; then
                echo "❌ .env missing!"
                exit 1
            fi

            # Public
            if [ ! -f "public/index.php" ]; then
                echo "❌ public/index.php missing!"
                exit 1
            fi

            # Build
            if [ ! -f "public/build/manifest.json" ]; then
                echo "❌ Vite manifest missing!"
                exit 1
            fi

            # Storage
            if [ ! -L "public/storage" ]; then
                echo "❌ public/storage is not a symlink!"
                exit 1
            fi

            # Storage target
            STORAGE_TARGET=$(readlink -f public/storage)

            EXPECTED_STORAGE="$APP_DIR/storage/app/public"

            if [ "$STORAGE_TARGET" != "$EXPECTED_STORAGE" ]; then
                echo "❌ Storage symlink points to wrong location!"
                echo "Expected:"
                echo "$EXPECTED_STORAGE"
                echo "Actual:"
                echo "$STORAGE_TARGET"
                exit 1
            fi

            # Public HTML
            if [ ! -L "public_html" ]; then
                echo "⚠️ public_html is not a symlink."
            else
                PUBLIC_HTML_TARGET=$(readlink -f public_html)

                if [ "$PUBLIC_HTML_TARGET" != "$APP_DIR/public" ]; then
                    echo "❌ public_html points to wrong location!"
                    echo "Expected:"
                    echo "$APP_DIR/public"
                    echo "Actual:"
                    echo "$PUBLIC_HTML_TARGET"
                    exit 1
                fi

                echo "✅ public_html -> public"
            fi

            echo ""
            echo "📁 Build size:"
            du -sh public/build

            echo ""
            echo "📁 Storage size:"
            du -sh storage

            echo ""
            echo "📁 Public size:"
            du -sh public

            echo ""
            echo "📌 Current commit:"
            git rev-parse --short HEAD

            echo ""
            echo "=========================================="
            echo "🎉 DEPLOYMENT SUCCESSFUL"
            echo "=========================================="